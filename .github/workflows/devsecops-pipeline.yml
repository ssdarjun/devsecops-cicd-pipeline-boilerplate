# =============================================================================
# DevSecOps CI/CD Pipeline — GitHub Actions Workflow
#
# Pipeline stages (shift-left security model):
#   1. Lint          → flake8 syntax/style check
#   2. SAST          → Bandit static security analysis
#   3. SCA           → pip-audit dependency vulnerability check
#   4. Unit Tests    → pytest with coverage
#   5. Container     → Docker build + Trivy image scan
#   6. Quality Gate  → Fail on CRITICAL/HIGH findings
# =============================================================================

name: DevSecOps CI Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

env:
  IMAGE_NAME: devsecops-app
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1 — Lint (Code Quality)
  # ---------------------------------------------------------------------------
  lint:
    name: "🔍 Lint — Syntax & Style"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Linting Dependencies
        run: pip install flake8

      - name: Run flake8
        run: |
          flake8 app/ \
            --max-line-length=100 \
            --exclude=app/tests/ \
            --format='%(path)s:%(row)d:%(col)d: %(code)s %(text)s'

  # ---------------------------------------------------------------------------
  # Stage 2 — SAST (Static Application Security Testing)
  # ---------------------------------------------------------------------------
  sast:
    name: "🛡️ SAST — Static Security Analysis"
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit SAST Scan
        run: |
          bandit -r app/ \
            --exclude app/tests \
            --severity-level medium \
            --confidence-level medium \
            --format json \
            --output bandit-report.json || true

      - name: Check for HIGH/CRITICAL SAST Findings
        run: |
          HIGH=$(python3 -c "
          import json, sys
          with open('bandit-report.json') as f:
              data = json.load(f)
          issues = [i for i in data.get('results', [])
                    if i['issue_severity'] in ('HIGH', 'CRITICAL')]
          print(len(issues))
          ")
          echo "High/Critical SAST findings: $HIGH"
          if [ "$HIGH" -gt "0" ]; then
            echo "❌ Quality Gate FAILED: SAST found $HIGH High/Critical issues"
            cat bandit-report.json | python3 -m json.tool
            exit 1
          fi
          echo "✅ SAST Quality Gate PASSED"

      - name: Upload SAST Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-sast-report
          path: bandit-report.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Stage 3 — SCA (Software Composition Analysis)
  # ---------------------------------------------------------------------------
  sca:
    name: "📦 SCA — Dependency Vulnerability Scan"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit SCA Scan
        run: |
          pip install -r app/requirements.txt
          pip-audit \
            --requirement app/requirements.txt \
            --format json \
            --output pip-audit-report.json || true

      - name: Check for HIGH/CRITICAL SCA Findings
        run: |
          VULNS=$(python3 -c "
          import json
          with open('pip-audit-report.json') as f:
              data = json.load(f)
          vulns = [v for dep in data.get('dependencies', [])
                   for v in dep.get('vulns', [])]
          print(len(vulns))
          ")
          echo "SCA vulnerabilities found: $VULNS"
          if [ "$VULNS" -gt "0" ]; then
            echo "❌ Quality Gate FAILED: SCA found $VULNS vulnerabilities"
            cat pip-audit-report.json | python3 -m json.tool
            exit 1
          fi
          echo "✅ SCA Quality Gate PASSED"

      - name: Upload SCA Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-sca-report
          path: pip-audit-report.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Stage 4 — Unit Tests with Coverage
  # ---------------------------------------------------------------------------
  test:
    name: "🧪 Unit Tests & Coverage"
    runs-on: ubuntu-latest
    needs: [sast, sca]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install -r app/requirements.txt
          pip install -r app/requirements-dev.txt

      - name: Run Tests with Coverage
        run: |
          pytest app/tests/ \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -v

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Stage 5 — Container Build & Image Scan
  # ---------------------------------------------------------------------------
  container-scan:
    name: "🐳 Container Build & Trivy Scan"
    runs-on: ubuntu-latest
    needs: test
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Quality Gate: table format, exit-code 1 blocks on CRITICAL/HIGH ---
      - name: "🔒 Trivy Image Scan — Quality Gate"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: ".trivyignore"

      # --- SARIF upload for GitHub Security tab (exit-code 0 — gate already done above) ---
      - name: "📄 Trivy Image Scan — Generate SARIF for GitHub Security"
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "sarif"
          output: "trivy-image.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          ignore-unfixed: true
          trivyignores: ".trivyignore"
          limit-severities-for-sarif: true

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif

      # --- Filesystem scan: secrets + IaC misconfigs in repo ---
      - name: "🗂️ Trivy Filesystem Scan — Quality Gate"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: ".trivyignore"

      - name: Upload Trivy Image Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-scan-report
          path: trivy-image.sarif
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Stage 6 — Quality Gate Summary
  # ---------------------------------------------------------------------------
  quality-gate:
    name: "🚦 Quality Gate — Final Decision"
    runs-on: ubuntu-latest
    needs: [lint, sast, sca, test, container-scan]
    if: always()
    steps:
      - name: Evaluate All Stage Results
        run: |
          echo "========================================"
          echo "  DevSecOps Quality Gate Summary"
          echo "========================================"
          echo "  Lint:            ${{ needs.lint.result }}"
          echo "  SAST (Bandit):   ${{ needs.sast.result }}"
          echo "  SCA (pip-audit): ${{ needs.sca.result }}"
          echo "  Unit Tests:      ${{ needs.test.result }}"
          echo "  Container Scan:  ${{ needs.container-scan.result }}"
          echo "========================================"

          if [[ "${{ needs.lint.result }}" != "success" ||
                "${{ needs.sast.result }}" != "success" ||
                "${{ needs.sca.result }}"  != "success" ||
                "${{ needs.test.result }}" != "success" ||
                "${{ needs.container-scan.result }}" != "success" ]]; then
            echo "❌ QUALITY GATE FAILED — Pipeline blocked. Review findings above."
            exit 1
          fi

          echo "✅ ALL QUALITY GATES PASSED — Pipeline succeeded."

